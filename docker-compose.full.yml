# =============================================================================
# docker-compose.full.yml — nm-services (Stack completo)
# Incluye: PostgreSQL + Redis + todos los microservicios NestJS
# Uso: ./scripts/start-docker-env.sh   (o ver ese script para comandos exactos)
# =============================================================================

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
    - .env.docker
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - default

services:

  # ── Infraestructura ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: nm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nm_services}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - nm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: nm_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  # ── Migración (corre una vez y sale) ─────────────────────────────────────────

  migrate:
    <<: *service-defaults
    container_name: nm_migrate
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-nm_services}
    command: >
      sh -c "npx prisma migrate deploy --schema=libs/database/prisma/schema.prisma && echo 'Migraciones aplicadas correctamente'"
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  # ── Microservicios ────────────────────────────────────────────────────────────

  gateway:
    <<: *service-defaults
    container_name: nm_gateway
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      SERVICE_NAME: gateway
      APP_PORT: 3000
      GATEWAY_PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      POS_SERVICE_URL: http://pos-service:3004
      FINANCE_SERVICE_URL: http://finance-service:3005
      HR_SERVICE_URL: http://hr-service:3006
      REPORT_SERVICE_URL: http://report-service:3007
      AI_ENGINE_URL: http://ai-engine:8000
      INVOICING_SERVICE_URL: http://invoicing-service:8000
      STORAGE_SERVICE_URL: http://storage-service:3008
    ports:
      - '3000:3000'
    depends_on:
      - migrate
      - auth-service
      - catalog-service
      - inventory-service
      - pos-service
      - finance-service
      - hr-service
      - report-service
      - ai-engine
      - invoicing-service
      - storage-service

  auth-service:
    <<: *service-defaults
    container_name: nm_auth
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth-service
    environment:
      SERVICE_NAME: auth-service
      APP_PORT: 3001
      STORAGE_SERVICE_URL: http://storage-service:3008
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-nm-storage-dev-key-change-in-production}
    ports:
      - '3001:3001'
    depends_on:
      - migrate
      - storage-service

  catalog-service:
    <<: *service-defaults
    container_name: nm_catalog
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      SERVICE_NAME: catalog-service
      APP_PORT: 3002
      STORAGE_SERVICE_URL: http://storage-service:3008
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-nm-storage-dev-key-change-in-production}
    ports:
      - '3002:3002'
    depends_on:
      - migrate
      - storage-service

  inventory-service:
    <<: *service-defaults
    container_name: nm_inventory
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      SERVICE_NAME: inventory-service
      APP_PORT: 3003
    ports:
      - '3003:3003'
    depends_on:
      - migrate

  pos-service:
    <<: *service-defaults
    container_name: nm_pos
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: pos-service
    environment:
      SERVICE_NAME: pos-service
      APP_PORT: 3004
    ports:
      - '3004:3004'
    depends_on:
      - migrate

  finance-service:
    <<: *service-defaults
    container_name: nm_finance
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: finance-service
    environment:
      SERVICE_NAME: finance-service
      APP_PORT: 3005
      STORAGE_SERVICE_URL: http://storage-service:3008
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-nm-storage-dev-key-change-in-production}
    ports:
      - '3005:3005'
    depends_on:
      - migrate
      - storage-service

  hr-service:
    <<: *service-defaults
    container_name: nm_hr
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: hr-service
    environment:
      SERVICE_NAME: hr-service
      APP_PORT: 3006
    ports:
      - '3006:3006'
    depends_on:
      - migrate

  report-service:
    <<: *service-defaults
    container_name: nm_report
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: report-service
    environment:
      SERVICE_NAME: report-service
      APP_PORT: 3007
      AI_ENGINE_URL: http://ai-engine:8000
    ports:
      - '3007:3007'
    depends_on:
      - migrate
      - ai-engine

  storage-service:
    <<: *service-defaults
    container_name: nm_storage
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: storage-service
    environment:
      SERVICE_NAME: storage-service
      APP_PORT: 3008
      STORAGE_DRIVER: local
      STORAGE_LOCAL_ROOT: /data/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:3000/api/v1/storage/files
      STORAGE_SERVICE_KEY: ${STORAGE_SERVICE_KEY:-nm-storage-dev-key-change-in-production}
    volumes:
      - storage_uploads:/data/uploads
    ports:
      - '3010:3008'   # host 3010 — evita conflicto con ai-engine (3008:8000)
    depends_on:
      - migrate

  # ── Invoicing Service (Laravel 12 + Greenter — polyglot PHP) ────────────────

  invoicing-service:
    build:
      context: ./services/invoicing
      dockerfile: Dockerfile.dev
    container_name: nm_invoicing
    restart: unless-stopped
    env_file:
      - ./services/invoicing/.env
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-nm_services}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - '3009:8000'
    volumes:
      - ./services/invoicing:/var/www/invoicing
      - invoicing_vendor:/var/www/invoicing/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # ── AI Engine (Python/FastAPI — polyglot, fuera del toolchain NestJS) ────────

  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: nm_ai_engine
    restart: unless-stopped
    env_file:
      - ./services/ai-engine/.env
    volumes:
      - ./services/ai-engine/models:/app/models
    ports:
      - '3008:8000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  # ── Herramientas opcionales ────────────────────────────────────────────────

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nm.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']
    networks:
      - default

volumes:
  # Nombres fijos (sin prefijo de proyecto) para que los datos sobrevivan
  # aunque cambies el nombre del proyecto Compose.
  nm_postgres_data:
    name: nm_postgres_data
  invoicing_vendor:
    name: nm_invoicing_vendor
  storage_uploads:
    name: nm_storage_uploads

networks:
  default:
    name: nm_network
    driver: bridge
